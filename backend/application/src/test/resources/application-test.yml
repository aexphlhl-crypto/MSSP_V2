spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        tenant_identifier_resolver: com.mspportal.common.tenant.CurrentTenantIdentifierResolverImpl
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

    show-sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
